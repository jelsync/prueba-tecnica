apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservice
  namespace: development
  labels:
    app: microservice
# Sin automountServiceAccountToken: el microservicio no llama a la API de
# Kubernetes: no necesita el token montado en el pod (menos superficie de
# ataque). Cuando se conecte a Vault vía VSO/CSI (Fase 5), esta service
# account es la que se usará para el Kubernetes auth method de Vault.
automountServiceAccountToken: false
