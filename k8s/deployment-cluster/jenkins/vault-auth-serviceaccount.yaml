# Identidad que Jenkins presenta a Vault (Kubernetes auth method) para leer
# el secreto del microservicio — separada de la ServiceAccount que el chart
# de Jenkins crea para sí mismo, para no mezclar "correr agentes de k8s" con
# "autenticarse contra Vault". No necesita ningún permiso RBAC de Kubernetes:
# Vault solo usa el JWT de este token para validarlo vía la API TokenReview,
# no lo usa para llamar a la API de k8s.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-vault-auth
  namespace: jenkins
