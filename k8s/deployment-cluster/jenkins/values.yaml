# Valores para el chart oficial jenkins/jenkins (5.9.45). Instalación (una
# vez el clúster deployment exista):
#   helm repo add jenkins https://charts.jenkins.io
#   helm install jenkins jenkins/jenkins -n jenkins -f values.yaml
#
# rbac.create=true y serviceAccount.create=true (defaults del chart): crea
# su propio ServiceAccount + Role/RoleBinding *namespaced* (no cluster-wide)
# para que el plugin de Kubernetes pueda crear/borrar pods de agentes dentro
# del namespace "jenkins" — no hace falta escribir ese RBAC a mano.

controller:
  additionalPlugins:
    # Lee secretos de Vault e inyecta variables de entorno en el pipeline.
    - hashicorp-vault-plugin
    # Pasos "docker.build" / "docker.push" en el Jenkinsfile.
    - docker-workflow
    # timestamps() en el Jenkinsfile — verificado con el linter real de
    # Jenkins (pipeline-model-converter/validate): sin este plugin la
    # opción no existe y el pipeline ni siquiera valida.
    - timestamper

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  JCasC:
    configScripts:
      # Credencial "Vault Kubernetes" declarada como código, no un paso manual
      # en la UI. El Jenkinsfile la referencia por vaultCredentialId. Campos
      # (id/description/role/mountPath) verificados contra el código fuente
      # de VaultKubernetesCredential.java del plugin, no adivinados.
      vault-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - vaultKubernetesCredential:
                      scope: GLOBAL
                      id: "vault-k8s-auth"
                      description: "Kubernetes auth contra Vault (mount kubernetes-jenkins)"
                      mountPath: "kubernetes-jenkins"
                      role: "jenkins-microservice"

persistence:
  enabled: true
  size: 8Gi

agent:
  # Agentes efímeros (un pod por build) vía el plugin de Kubernetes — nada
  # de un agente fijo de larga duración.
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
