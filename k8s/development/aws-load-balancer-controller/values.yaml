# Valores para el chart oficial eks/aws-load-balancer-controller (3.4.3).
# Instalación (una vez el clúster development exista):
#   helm repo add eks https://aws.github.io/eks-charts
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system -f values.yaml
#
# Necesario porque los Service (microservicio y el interno de Vault) fijan
# subredes por anotación en vez de por tags — el proveedor in-tree legacy no
# lo soporta, ver k8s/development/service.yaml y
# k8s/deployment-cluster/vault/service-internal-lb.yaml.

clusterName: labeks-development-dev
region: us-east-1
# vpcId: sin fijar aquí a propósito, para no versionar el VPC ID real de la
# cuenta compartida. Pasarlo con --set vpcId=... al instalar/actualizar.
#
# Probado en vivo: la auto-detección vía IMDS del nodo FALLA dentro del
# pod ("context deadline exceeded" pidiendo la metadata) — muy probablemente
# el hop limit de IMDS del launch template (por defecto 1, un contenedor
# necesita 2 saltos). No se ajustó el launch template para no forzar un
# reemplazo de nodos ya corriendo; el --set vpcId de abajo evita el problema
# sin tocar nada más.

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    # Reemplazar con la salida "alb_controller_role_arn" del stack de
    # Terraform (development-cluster) una vez aplicado.
    eks.amazonaws.com/role-arn: "<ALB_CONTROLLER_ROLE_ARN>"

# helm install/upgrade ... -f values.yaml \
#   --set vpcId=<vpc_id real> \
#   --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<alb_controller_role_arn real>

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
