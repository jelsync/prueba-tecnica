# Identidad IRSA que usa el pod agente de Jenkins que hace el deploy al
# clúster development — separada de jenkins-ecr-push por mínimo privilegio
# (esta no puede tocar ECR, esa no puede tocar la API de otro clúster).
# El acceso real dentro de k8s lo otorga el Access Entry de
# terraform/infrastructure/development-cluster/jenkins-deploy-access.tf,
# acotado al namespace "development" — no cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deploy
  namespace: jenkins
  annotations:
    # Reemplazar con la salida "jenkins_deploy_role_arn" del stack de
    # Terraform una vez aplicado.
    eks.amazonaws.com/role-arn: "<JENKINS_DEPLOY_ROLE_ARN>"
