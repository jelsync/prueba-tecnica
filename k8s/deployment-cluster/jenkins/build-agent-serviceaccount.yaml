# Identidad IRSA que usa el pod agente de Jenkins que construye y publica la
# imagen — no la ServiceAccount del propio chart de Jenkins (esa administra
# pods, no necesita tocar AWS). "eks.amazonaws.com/role-arn" es lo que le da
# a este pod credenciales de AWS sin ningún access key guardado en Jenkins.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ecr-push
  namespace: jenkins
  annotations:
    # Reemplazar con la salida "ecr_push_role_arn" del stack de Terraform
    # una vez aplicado.
    eks.amazonaws.com/role-arn: "<ECR_PUSH_ROLE_ARN>"
