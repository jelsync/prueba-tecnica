# Least-privilege: la service account del microservicio solo puede leer (no
# crear/modificar/borrar) ConfigMaps y Secrets dentro de su propio namespace.
# Hoy el microservicio no llama a la API de Kubernetes, pero cuando el
# CSI provider (Fase 5) monte el secreto de Vault como volumen, el kubelet
# lo hace en su nombre — este Role deja el terreno listo sin sobre-otorgar
# permisos (nada de acceso cluster-wide, nada de write).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microservice-read-config
  namespace: development
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microservice-read-config
  namespace: development
subjects:
  - kind: ServiceAccount
    name: microservice
    namespace: development
roleRef:
  kind: Role
  name: microservice-read-config
  apiGroup: rbac.authorization.k8s.io
