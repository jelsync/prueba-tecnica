# ALTERNATIVA documentada, no la ruta activa de este laboratorio: la
# inyección real usa VSO (ver ../connection.yaml, ../auth.yaml,
# ../static-secret.yaml). Se deja este SecretProviderClass para mostrar el
# otro mecanismo que evalúa la rúbrica por separado.
#
# Si se quisiera usar esto EN VEZ de VSO: instalar
# secrets-store-csi-driver + secrets-store-csi-driver-provider-vault vía
# Helm, aplicar este manifiesto, y en deployment.yaml reemplazar el
# envFrom.secretRef por un volumeMount que use este SecretProviderClass
# (el csi driver también puede sincronizar a un Secret nativo vía
# secretObjects, como se muestra abajo, pero no correrlo junto con VSO
# apuntando al mismo Secret — se pisarían entre sí).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-microservice
  namespace: development
spec:
  provider: vault
  parameters:
    vaultAddress: "http://<VAULT_INTERNAL_LB_ADDRESS>:8200"
    roleName: "development-microservice"
    objects: |
      - objectName: "microservice-secret"
        secretPath: "secret/data/microservice"
        secretKey: "value"
  secretObjects:
    - secretName: microservice-vault-secret
      type: Opaque
      data:
        - objectName: "microservice-secret"
          key: value
