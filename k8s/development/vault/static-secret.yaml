# Sincroniza secret/data/microservice desde Vault hacia un Secret nativo de
# Kubernetes llamado "microservice-vault-secret" — exactamente el nombre que
# ../deployment.yaml ya referencia en su envFrom. VSO lo mantiene actualizado
# cada refreshAfter; no hace falta reiniciar el pod a mano cuando el valor
# cambie en Vault (aunque si se quiere rollout automático, VSO también
# soporta "rolloutRestartTargets", no usado aquí para mantenerlo simple).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: microservice-secret
  namespace: development
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: microservice
  refreshAfter: 30s
  destination:
    name: microservice-vault-secret
    create: true
