apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice
  namespace: development
  labels:
    app: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice
  template:
    metadata:
      labels:
        app: microservice
    spec:
      serviceAccountName: microservice
      securityContext:
        runAsNonRoot: true
        # UID numerico que coincide con el "USER 10001" del Dockerfile. Sin un
        # runAsUser numerico, Kubernetes no puede verificar que el usuario de
        # la imagen (nombre "app") sea no-root y rechaza el contenedor con
        # "cannot verify user is non-root" (confirmado en vivo).
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: microservice
          # La imagen real la fija el Jenkinsfile en el deploy (Fase 6),
          # apuntando al ECR creado para este laboratorio.
          image: "<ECR_REPOSITORY_URI>:latest"
          ports:
            - name: http
              containerPort: 8080
          env:
            # Mapea explicitamente la clave "value" del Secret que sincroniza
            # VSO (secret/microservice en Vault, clave "value") a la env var
            # VAULT_SECRET que lee la app. NO se usa envFrom: ese crea env vars
            # con el NOMBRE de cada clave del Secret ("value", "_raw"), no
            # "VAULT_SECRET" -> la app veia el secreto como no inyectado
            # (confirmado en vivo). "optional: true" para que el pod arranque
            # aunque el Secret aun no exista.
            - name: VAULT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservice-vault-secret
                  key: value
                  optional: true
            - name: APP_CONFIG_MESSAGE
              value: "configuracion-del-deployment-development"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            # Tomcat necesita un /tmp escribible aunque el resto del
            # filesystem sea de solo lectura (verificado con
            # `docker run --read-only --tmpfs /tmp`: sin este mount el
            # contenedor no arranca).
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
