apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice
  namespace: development
  labels:
    app: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice
  template:
    metadata:
      labels:
        app: microservice
    spec:
      serviceAccountName: microservice
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: microservice
          image: "<ECR_REPOSITORY_URI>:latest"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VAULT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservice-vault-secret
                  key: value
                  optional: true
            - name: APP_CONFIG_MESSAGE
              value: "configuracion-del-deployment-development"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
