apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microservice-read-config
  namespace: development
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microservice-read-config
  namespace: development
subjects:
  - kind: ServiceAccount
    name: microservice
    namespace: development
roleRef:
  kind: Role
  name: microservice-read-config
  apiGroup: rbac.authorization.k8s.io
