# Cómo se autentica VSO contra Vault: Kubernetes auth method, usando la
# ServiceAccount "microservice" que ya existe (ver ../serviceaccount.yaml) —
# no se crea una identidad nueva solo para esto. El mount y el role los deja
# listos vault-k8s-auth-setup.sh en este mismo directorio.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: development
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes-development
  kubernetes:
    role: development-microservice
    serviceAccount: microservice
    audiences:
      - vault
