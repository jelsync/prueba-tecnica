# Extra opcional del laboratorio: CRD para configuración declarativa de
# microservicios (logLevel, restartPolicy, healthCheckPath). El validado
# real contra un clúster (kind), CRD + CR + controlador, se documenta en
# k8s/extras/microserviceconfig/README.md.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: microserviceconfigs.labeks.jelsync.hn
spec:
  group: labeks.jelsync.hn
  scope: Namespaced
  names:
    kind: MicroserviceConfig
    listKind: MicroserviceConfigList
    plural: microserviceconfigs
    singular: microserviceconfig
    shortNames:
      - msc
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: LogLevel
          type: string
          jsonPath: .spec.logLevel
        - name: RestartPolicy
          type: string
          jsonPath: .spec.restartPolicy
        - name: HealthCheckPath
          type: string
          jsonPath: .spec.healthCheckPath
        - name: LastProcessed
          type: string
          jsonPath: .status.lastProcessedAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["logLevel", "restartPolicy", "healthCheckPath"]
              properties:
                logLevel:
                  type: string
                  enum: ["info", "debug", "warn", "error"]
                restartPolicy:
                  type: string
                  enum: ["Always", "OnFailure", "Never"]
                healthCheckPath:
                  type: string
                  pattern: "^/.*"
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                lastProcessedAt:
                  type: string
